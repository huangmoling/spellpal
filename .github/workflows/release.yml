name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check & build frontend
        run: npm run build

      # package.json 里 signAndEditExecutable=false（本机打包时解压签名工具会因权限失败），
      # 因此 CI 产出的 exe 不含自定义图标与版本信息；带图标的包由维护者本地构建后上传。
      - name: Build installer & portable
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spellpal-windows
          path: |
            release/*.exe
            release/*.blockmap

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
